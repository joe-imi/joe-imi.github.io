        <meta charset="utf-8">
        <title>Joeの占い部屋 | joe意味.com</title>

        <link rel="stylesheet" href="style.css">
        <style>
            .uranai-container {
                max-width: 560px;
                margin: 0 auto;
                padding: 2rem 1rem;
            }
            .uranai-step { display: none; }
            .uranai-step.active { display: block; }
            .progress {
                display: flex;
                gap: 8px;
                justify-content: center;
                margin-bottom: 2rem;
            }
            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #ccc;
            }
            .dot.done { background: #0000FF; }
            .dot.current { background: #FF4F02; }
            .q-number {
                font-size: 14px;
                color: #555;
                text-align: center;
                margin-bottom: 0.5rem;
            }
            .pattern-badge {
                font-size: 12px;
                color: #999;
                text-align: center;
                margin-bottom: 1rem;
            }
            .uranai-question {
                font-size: 22px;
                font-weight: bold;
                text-align: center;
                margin-bottom: 1.5rem;
                line-height: 1.6;
            }
            .choices {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 1.5rem;
            }
            .choice-btn {
                background: #fff;
                border: 2px solid #FF99CC;
                border-radius: 8px;
                padding: 0.75rem 1rem;
                font-size: 16px;
                cursor: pointer;
                text-align: left;
                font-family: sans-serif;
                transition: background 0.15s;
            }
            .choice-btn:hover { background: #FFE5F2; }
            .choice-btn.selected {
                border-color: #0000FF;
                background: #e8e8ff;
            }
            .next-btn {
                width: 100%;
                padding: 0.75rem;
                border-radius: 8px;
                background: #FF99CC;
                color: #fff;
                border: none;
                font-size: 16px;
                cursor: pointer;
                font-family: sans-serif;
                opacity: 0.4;
                pointer-events: none;
            }
            .next-btn.enabled {
                opacity: 1;
                pointer-events: auto;
            }
            .result-card {
                background: #fff;
                border: 3px solid #FF99CC;
                border-radius: 12px;
                padding: 2rem;
                text-align: center;
            }
            .result-label {
                font-size: 14px;
                color: #999;
                margin-bottom: 0.75rem;
            }
            .result-gif {
                width: 100%;
                max-width: 300px;
                border-radius: 8px;
                margin: 0 auto 1.5rem;
                display: block;
            }
            .result-title {
                font-size: 28px;
                font-weight: bold;
                color: #FF4F02;
                margin-bottom: 0.75rem;
            }
            .result-desc {
                font-size: 16px;
                color: #333;
                line-height: 1.8;
                margin-bottom: 1.5rem;
            }
            .retry-btn {
                background: #FF99CC;
                border: none;
                border-radius: 8px;
                padding: 0.6rem 2rem;
                font-size: 16px;
                cursor: pointer;
                color: #fff;
                font-family: sans-serif;
            }
        </style>

                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>

                    <div class="choices" id="c1"></div>
                    <button class="next-btn" id="next1" onclick="go(2)">次へ →</button>

                <div class="uranai-step" id="step2">
                    <div class="progress">
                        <div class="dot done"></div>

                <div class="uranai-step" id="step3">

                        <div class="dot done"></div>

                    <div class="q-number">質問 3 / 3</div>

                        <div class="result-desc" id="r-desc"></div>

                    </div>
                </div>

            </div>
        </div>

        <div class="footer">
            <div class="footer-logo">See <span>you</span> again.</div>
            <div class="footer-list">

                    <li><a href="https://twitter.com/JoeYabuki_NS/status/1624957440918978560?s=20">挑戦1</a></li>

        </div>

            {qs:['夢を覚えていることが多い？','今一番欲しいものは？','好きな乗り物は？'],cs:[['いつも鮮明に覚えてる','たまに覚えてる','ほとんど覚えてない','夢を見ない'],['時間','お金','愛情','静けさ'],['飛行機','新幹線','バイク','徒歩']]},
            {qs:['緊張する場面でどうなる？','ランチを1人で食べるとき？','買い物の仕方は？'],cs:[['テンションが上がる','いつも通り','少し固くなる','固まって動けなくなる'],['スマホを見ながら','本を読みながら','ぼーっとしながら','急いで食べる'],['即決する','少し悩む','長時間迷う','買わないことが多い']]},

            {qs:['今すぐ空を飛べるとしたら？','好きな数字は？','今この瞬間の感情に近いのは？'],cs:[['どこへでも飛んでいく','高いところは少し怖い','近場をふわふわ','飛ばなくていい'],['1','7','8','0'],['ワクワク','穏やか','ぼんやり','だるい']]},
            {qs:['人生で大事にしていることは？','好きな香りは？','今の自分に必要なものは？'],cs:[['情熱','バランス','安定','自由'],['コーヒー','雨上がりの土','柑橘系','無臭がいい'],['やる気','美味しいもの','睡眠','何も要らない']]},
            {qs:['新しいことを始めるとき？','今の気分に合う飲み物は？','休日に一人でできる趣味は？'],cs:[['すぐ行動する','計画を立ててから','少し様子を見る','なかなか始められない'],['エナジードリンク','緑茶','炭酸水','温かいミルク'],['筋トレ','読書','料理','ゲーム']]},
            {qs:['SNSに投稿する頻度は？','明日の天気が大雨だとしたら？','映画を見るなら？'],cs:[['ほぼ毎日','週数回','月に数回','ほとんどしない'],['関係なく行動する','傘を準備して予定通り','予定を少し変える','外出をやめる'],['夜のレイトショー','休日の昼間','一人で深夜','家で見る']]},
            {qs:['友達から「今暇？」と連絡が来たら？','好きなお菓子は？','今の生活リズムは？'],cs:[['即「暇！」と返す','内容を確認する','少し考えてから返す','既読スルー'],['ポテチ','チョコレート','グミ','お菓子は食べない'],['規則正しい','だいたい規則正しい','少し乱れている','完全に崩れている']]},
            {qs:['自分を一言で表すとしたら？','今すぐ1億円もらったら？','好きなゲームのジャンルは？'],cs:[['情熱的','穏やか','マイペース','謎'],['投資する','旅行に使う','家族や友達に渡す','貯金する'],['アクション','RPG','パズル','ゲームはしない']]},
            {qs:['電車に乗ったとき、何をする？','最近笑ったのはいつ？','今日の調子を天気で例えると？'],cs:[['音楽を聴く','スマホをいじる','外の景色を眺める','寝る'],['今日','昨日','数日前','覚えていない'],['快晴','晴れのち曇り','曇り','雨']]},
            {qs:['好きな食べ物のテクスチャーは？','今年の目標は達成できそう？','好きな時間の過ごし方は？'],cs:[['サクサク','もちもち','とろとろ','なんでもいい'],['絶対達成できる','たぶん大丈夫','微妙なところ','目標を立てていない'],['人と話す','一人で考える','何かを作る','ただぼーっとする']]},
            {qs:['人生をゲームに例えると、今何ステージ目？','今の自分のキャッチコピーは？','昨日何時間寝た？'],cs:[['ボスを倒したあと','中盤の難関ステージ','チュートリアル','ゲームオーバー寸前'],['最強の男','等身大の人','謎の人物','充電中'],['8時間以上','6〜8時間','4〜6時間','4時間以下']]},
            {qs:['今の自分の状態に近いスマホは？','人生で一番大切なものは？','好きな食べ方は？'],cs:[['充電100%','充電60%','充電20%','電源が切れそう'],['仲間','自由','安心','楽しさ'],['一口ずつゆっくり','混ぜながら食べる','好きなものを最後に残す','好きなものから食べる']]},
            {qs:['明日の朝起きたら最初に何をする？','今一番行きたい場所は？','今日一番頑張ったことは？'],cs:[['運動する','美味しい朝食を食べる','しばらくスマホを見る','もう一回寝る'],['海外リゾート','温泉','近所のカフェ','布団の中'],['大きな仕事をやり遂げた','普通に仕事した','なんとかこなした','特に頑張っていない']]},
            {qs:['今日のランチは何にする？','好きな休日の始まり方は？','今の自分へのご褒美は？'],cs:[['豪華なランチ','いつものお店','コンビニ','抜く'],['早起きして朝活','ゆっくり起きて朝食','お昼ごろ起きる','夕方まで寝る'],['高いディナー','映画や本','昼寝','特に何もしない']]}
        ];

        const results = [
            {title:'サイコッチョー！！', gif:'saikoccho.gif', desc:'今日のあなたは無敵です。何をやってもうまくいく予感しかしない。全力で攻めていきましょう。この調子でいけばデカコーンも夢じゃない。'},
            {title:'気分Joe Joe',        gif:'joejoe.gif',   desc:'今日はなかなかいい感じ。テンションは高くないけど、ちゃんと前向き。そんな日が実は一番いい仕事できたりする。'},
            {title:'ニュートラルです',   gif:'neutral.gif', desc:'可もなく不可もない、まさに「ニュートラル」な一日。無理せず流れに乗って、穏やかに過ごすのが正解です。'},
            {title:'今日はダメだ',       gif:'dame.gif',    desc:'今日はそういう日。エネルギーを温存して、おいしいものを食べて早めに寝ましょう。明日のJoeに期待。'},
        ];

        let current, scores;

        function init() {
            current = patterns[Math.floor(Math.random() * patterns.length)];
            scores = [null, null, null];
            for (let i = 1; i <= 3; i++) {
                document.getElementById('q' + i).textContent = current.qs[i - 1];
                const cc = document.getElementById('c' + i);
                cc.innerHTML = '';
                current.cs[i - 1].forEach((t, idx) => {
                    const b = document.createElement('button');
                    b.className = 'choice-btn';
                    b.textContent = t;
                    b.onclick = () => sel(b, i - 1, idx);
                    cc.appendChild(b);
                });
                document.getElementById('next' + i).classList.remove('enabled');
            }
            document.getElementById('badge').textContent = 'パターン ' + (patterns.indexOf(current) + 1) + ' / 30';
            document.querySelectorAll('.uranai-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step1').classList.add('active');
        }

        function sel(btn, qIdx, val) {
            btn.closest('.choices').querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            scores[qIdx] = val;
            document.getElementById('next' + (qIdx + 1)).classList.add('enabled');
        }

        function go(n) {
            document.querySelectorAll('.uranai-step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + n).classList.add('active');
        }

        function showResult() {
            const total = scores[0] + scores[1] + scores[2];
            const idx = total <= 2 ? 0 : total <= 5 ? 1 : total <= 7 ? 2 : 3;
            const r = results[idx];
            document.getElementById('r-gif').src = r.gif;
            document.getElementById('r-title').textContent = r.title;
            document.getElementById('r-desc').textContent = r.desc;
            document.querySelectorAll('.uranai-step').forEach(s => s.classList.remove('active'));
            document.getElementById('result').classList.add('active');
        }

        init();
        </script>
    </body>
</html>
